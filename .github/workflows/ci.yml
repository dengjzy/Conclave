name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: typecheck
          - name: Tests
            command: test
          - name: Build
            command: build
          - name: Plugin SDK
            command: verify:plugin-sdk
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.registry=https://registry.npmjs.org/
      - name: Run ${{ matrix.name }}
        run: pnpm ${{ matrix.command }}
